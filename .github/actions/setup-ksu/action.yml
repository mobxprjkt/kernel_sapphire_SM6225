name: setup-ksu
description: clone + integrate KSU variant and SUSFS — delegates to scripts/setup-ksu.sh

inputs:
  ksu_type:
    required: true
  kernel_dir:
    required: true
  work_dir:
    required: true
  sksu_tag_pin:
    description: "Optional exact SukiSU-Nova ref to checkout instead of floating builtin branch"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        KSU_TYPE:     ${{ inputs.ksu_type }}
        KERNEL_DIR:   ${{ inputs.kernel_dir }}
        WORK_DIR:     ${{ inputs.work_dir }}
        SKSU_TAG_PIN: ${{ inputs.sksu_tag_pin }}
      run: bash ${{ github.workspace }}/scripts/setup-ksu.sh
