name: "Build Kernel — AIO"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      zip_mode:
        description: "Package output"
        type: choice
        options: [per-variant, aio, both]
        default: per-variant
      build_type:
        description: "Build type"
        type: choice
        options: [stable, testing]
        default: stable
      nuke_release:
        description: "Remove existing release assets before upload"
        type: boolean
        default: false
      notify:
        description: "Send Telegram notifications"
        type: boolean
        default: false
      use_ccache:
        description: "Enable ccache"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.ts.outputs.start_time }}
    steps:
      - id: ts
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

  build:
    name: Build SukiSU-Nova
    needs: setup
    uses: ./.github/workflows/build-kernel.yml
    with:
      variant_name: Sapphiren-SukiSU-Nova
      source_type: gki
      ksu_type: sksu
      zip_prefix: Sapphiren_SukiSU-Nova
      artifact_name: gki-sksu
      defconfig: gki_defconfig
      build_type: ${{ inputs.build_type || 'stable' }}
      notify: ${{ inputs.notify == true }}
      use_ccache: ${{ inputs.use_ccache == true }}
    secrets: inherit

  release:
    name: Package & Release
    needs: [setup, build]
    if: success()
    uses: ./.github/workflows/release.yml
    with:
      zip_mode: ${{ inputs.zip_mode || 'per-variant' }}
      build_type: ${{ inputs.build_type || 'stable' }}
      start_time: ${{ needs.setup.outputs.start_time }}
      workflow_type: aio
      nuke_release: ${{ inputs.nuke_release == true }}
      notify: ${{ inputs.notify == true }}
      use_ccache: ${{ inputs.use_ccache == true }}
    secrets: inherit
