name: "Build Kernel — SukiSU-Nova + SUSFS + KPM"

on:
  workflow_call:
    inputs:
      variant_name:
        type: string
        required: true
      artifact_name:
        type: string
        required: true
      defconfig:
        type: string
        required: true

env:
  OUT_DIR: out
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: "${{ inputs.variant_name }}"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      WORK_DIR: ${{ github.workspace }}
      KERNEL_SRC: ${{ github.workspace }}/kernel_src
      SOURCE_TYPE: gki
      KSU_TYPE: sksu
      DEFCONFIG: ${{ inputs.defconfig }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Setup build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential flex git libelf-dev libssl-dev \
            curl jq zstd dwarves zip patch gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Linux 5.15 GKI source
        run: bash scripts/clone-source.sh

      - name: Setup Clang
        run: bash scripts/setup-toolchain.sh

      - name: Integrate SukiSU-Nova + SUSFS
        env:
          KERNEL_DIR: ${{ env.KERNEL_SRC }}
          WORK_DIR: ${{ env.WORK_DIR }}
        run: bash scripts/setup-ksu.sh

      - name: Enable SukiSU-Nova + SUSFS + KPM
        env:
          KERNEL_SRC: ${{ env.KERNEL_SRC }}
          DEFCONFIG: ${{ env.DEFCONFIG }}
        run: |
          DEFCONFIG="$KERNEL_SRC/arch/arm64/configs/$DEFCONFIG" \
            bash scripts/setup-configs.sh

      - name: Build kernel
        run: bash scripts/build.sh

      - name: Verify kernel
        run: bash scripts/verify-kernel.sh

      - name: Package AnyKernel3 ZIP
        run: bash scripts/pack-zip.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ github.workspace }}/AK3-*.zip
            ${{ github.workspace }}/out/dist/Image
            ${{ github.workspace }}/out/dist/kernel_version.txt
          retention-days: 7
